[package]
name = "montage-video"
version = "0.1.0"
description = "Logiciel de montage vidéo simple pour débutants"
authors = ["Yann"]
license = "MIT"
edition = "2021"

[lib]
name = "montage_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
