# Fabrique l'installateur Windows du logiciel, avec FFmpeg inclus.
#
# - À chaque PR et à chaque mise à jour de main : tests + installateur
#   téléchargeable dans l'onglet « Actions » (rubrique « Artifacts »).
# - Pour une version officielle : créer un tag « v0.1.0 » ; l'installateur
#   est alors publié dans l'onglet « Releases » du dépôt.
name: Installateur Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: Télécharger FFmpeg (build GPL de BtbN)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $dir = Get-ChildItem ffmpeg-tmp | Select-Object -First 1
          Copy-Item "$($dir.FullName)/bin/ffmpeg.exe", "$($dir.FullName)/bin/ffprobe.exe" src-tauri/ffmpeg/
          Copy-Item "$($dir.FullName)/LICENSE.txt" src-tauri/ffmpeg/LICENCE-FFMPEG.txt
          "$PWD/src-tauri/ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Tests de l'interface
        run: npm test

      - name: Tests de la partie Rust (dont un vrai export avec FFmpeg)
        working-directory: src-tauri
        run: cargo test -- --include-ignored

      - name: Fabriquer l'installateur
        run: npx tauri build

      - name: Mettre l'installateur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: installateur-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publier la version (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
